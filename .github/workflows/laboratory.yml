name: Independent laboratory contracts
on:
  push:
    paths: ['lab/**', '.github/workflows/laboratory.yml']
  pull_request:
    paths: ['lab/**', '.github/workflows/laboratory.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install -r lab/requirements-simulation.lock
      - name: Scientific and observation contracts (no model download)
        working-directory: lab
        env:
          TOKENLEAK_WORKSPACE: ${{ github.workspace }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: python -m unittest discover -s tests -v
